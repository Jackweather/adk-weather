<!DOCTYPE html>
<html>
<head>
  <title>More - Weather App</title>
  <meta charset="utf-8" />
  <style>
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: #f7f7f7; 
      margin: 0;
      padding-top: 54px; /* Prevent navbar overlap */
      box-sizing: border-box;
    }
    #top-navbar {
      width: 100vw;
      background: #263159;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 32px;
      height: 54px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
    }
    .nav-item {
      margin-right: 32px;
      font-size: 1.1em;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
      transition: color 0.15s;
      cursor: pointer;
      user-select: none;
    }
    .nav-item:hover { color: #ffb400; }
    /* Satellite overlay controls styling */
    .satellite-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 18px 0 10px 0;
      flex-wrap: wrap;
    }
    .satellite-btn {
      background: #263159;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 18px;
      font-size: 1em;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, box-shadow 0.13s;
      box-shadow: 0 1px 4px rgba(38,49,89,0.08);
      outline: none;
      min-width: 80px;
    }
    .satellite-btn:disabled {
      background: #bfc6e0;
      color: #fff;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .satellite-btn:hover:not(:disabled), .satellite-btn:focus:not(:disabled) {
      background: #ffb400;
      color: #263159;
      box-shadow: 0 2px 8px rgba(255,180,0,0.13);
    }
    #current-png-label {
      font-weight: bold;
      color: #263159;
      background: #f3f4fa;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 1.04em;
      box-shadow: 0 1px 4px rgba(38,49,89,0.06);
      min-width: 120px;
      text-align: center;
      word-break: break-all;
    }
    .main-content { 
      padding: 40px; 
      max-width: 900px;
      margin: 0 auto;
    }
    #map {
      width: 100%;
      height: 500px;
      margin-top: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      background: #fff;
      min-height: 300px;
      min-width: 0;
    }
    /* Responsive styles for mobile/iPhone */
    @media (max-width: 700px) {
      .main-content {
        padding: 12px 2vw 12px 2vw;
        max-width: 100vw;
      }
      .satellite-controls {
        flex-direction: column;
        gap: 8px;
        margin: 12px 0 8px 0;
      }
      #map {
        height: 48vw;
        min-height: 220px;
        max-height: 60vw;
      }
      #current-png-label {
        font-size: 0.98em;
        padding: 6px 8px;
        min-width: 80px;
      }
      .satellite-btn {
        font-size: 0.98em;
        padding: 6px 12px;
        min-width: 60px;
      }
    }
    @media (max-width: 480px) {
      .main-content {
        padding: 6px 1vw 6px 1vw;
      }
      #map {
        height: 38vw;
        min-height: 120px;
        max-height: 50vw;
      }
      #current-png-label {
        font-size: 0.93em;
        padding: 5px 4px;
        min-width: 60px;
      }
      .satellite-btn {
        font-size: 0.93em;
        padding: 5px 8px;
        min-width: 44px;
      }
    }
    #snapshot-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 16px;
    }
    #snapshot-gallery img {
      width: 180px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    #snapshot-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #modal-img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 2px 16px #000;
    }
    #modal-caption {
      color: #fff;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
    <div id="top-navbar">
      <a class="nav-item" href="/home.html">Home</a>
      <a class="nav-item" href="/more.html">More</a>
      <a class="nav-item" href="/settings.html">Settings</a>
      <a class="nav-item" href="/HRRR.html">Weather Model Page</a>
      <!-- Optional: Centered dropdown like HRRR -->

      <div id="navbar-center-dropdown-container">
        <div id="navbar-center-dropdown">
          <button id="navbar-center-dropdown-btn" aria-haspopup="true" aria-expanded="false">
            Select Model
            <span style="margin-left:6px;">&#9662;</span>
          </button>
          <div id="navbar-center-dropdown-list" role="menu">
            <a href="HRRR.html" role="menuitem">HRRR</a>
            <a href="NBM.html" role="menuitem">NBM</a>
          </div>
        </div>
      </div>

    </div>
  <div class="main-content">
    <h2>Satellite Imagery Overlay</h2>
    <div class="satellite-controls">
      <button id="prev-png" class="satellite-btn">Previous</button>
      <span id="current-png-label"></span>
      <button id="next-png" class="satellite-btn">Next</button>
      <button id="play-png" class="satellite-btn" style="margin-left:12px;">Play</button>
      <button id="stop-png" class="satellite-btn" style="margin-left:4px;display:none;">Stop</button>
    </div>
    <div id="map"></div>
    <h2>Latest NWS AFD Summary</h2>
    <div style="font-size:0.98em;color:#444;margin-bottom:8px;">
      <b>Note:</b>  Albany, New York area only.
    </div>
    <div id="afd-summary">Loading summary...</div>
    <script>
      // Adjust the filename/site as needed
      fetch('afd_summary_ALY.txt')
        .then(response => response.text())
        .then(text => {
          document.getElementById('afd-summary').textContent = text;
        })
        .catch(err => {
          document.getElementById('afd-summary').textContent = "Failed to load summary.";
        });
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
      // Leaflet map with only PNG overlay (no live satellite)
      var map = L.map('map').setView([39, -96], 4); // Centered on CONUS

      // Add OpenStreetMap base layer
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 10,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // --- Satellite PNG overlay logic ---
      let imageOverlay = null;
      let pngFiles = [];
      let currentPngIdx = -1;

      // Approximate bounds for CONUS at zoom 4 (adjust as needed)
      const conusBounds = [
        [24.396308, -125.0], // Southwest lat, lon
        [49.384358, -66.93457] // Northeast lat, lon
      ];

      function setPngOverlayByIndex(idx) {
        if (imageOverlay) {
          map.removeLayer(imageOverlay);
          imageOverlay = null;
        }
        if (pngFiles.length === 0 || idx < 0 || idx >= pngFiles.length) {
          document.getElementById('current-png-label').textContent = '';
          document.getElementById('prev-png').disabled = true;
          document.getElementById('next-png').disabled = true;
          return;
        }
        const file = pngFiles[idx];
        document.getElementById('current-png-label').textContent = file;
        imageOverlay = L.imageOverlay('/satellite_images/' + file, conusBounds, {opacity: 0.85}).addTo(map);
        // Enable/disable buttons based on position
        document.getElementById('prev-png').disabled = (idx >= pngFiles.length - 1);
        document.getElementById('next-png').disabled = (idx <= 0);
      }

      function loadPngListAndInit() {
        fetch('/satellite_images')
          .then(response => response.json())
          .then(files => {
            pngFiles = files;
            if (pngFiles.length > 0) {
              // Show the newest PNG (first in sorted list) on load
              currentPngIdx = 0;
              setPngOverlayByIndex(currentPngIdx);
            } else {
              currentPngIdx = -1;
              setPngOverlayByIndex(-1);
            }
          });
      }

      let playInterval = null;
      let isPlaying = false;

      function playPngLoop() {
        if (isPlaying || pngFiles.length === 0) return;
        isPlaying = true;
        document.getElementById('play-png').style.display = 'none';
        document.getElementById('stop-png').style.display = '';
        // Start with the oldest PNG (last in sorted list)
        currentPngIdx = pngFiles.length - 1;
        setPngOverlayByIndex(currentPngIdx);
        // 1.7 seconds for each frame
        let frameDelay = 1100;
        playInterval = setInterval(function() {
          if (pngFiles.length === 0) return;
          // Move to next (newer) PNG, loop to oldest if at start
          if (currentPngIdx > 0) {
            currentPngIdx--;
          } else {
            currentPngIdx = pngFiles.length - 1;
          }
          setPngOverlayByIndex(currentPngIdx);
        }, frameDelay);
      }

      function stopPngLoop() {
        isPlaying = false;
        if (playInterval) clearInterval(playInterval);
        playInterval = null;
        document.getElementById('play-png').style.display = '';
        document.getElementById('stop-png').style.display = 'none';
      }

      document.getElementById('play-png').onclick = playPngLoop;
      document.getElementById('stop-png').onclick = stopPngLoop;

      // Add button navigation for PNGs
      document.getElementById('prev-png').onclick = function() {
        stopPngLoop();
        if (currentPngIdx < pngFiles.length - 1) {
          currentPngIdx++;
          setPngOverlayByIndex(currentPngIdx);
        }
      };
      document.getElementById('next-png').onclick = function() {
        stopPngLoop();
        if (currentPngIdx > 0) {
          currentPngIdx--;
          setPngOverlayByIndex(currentPngIdx);
        }
      };

      // Add arrow key navigation for PNGs
      let lastArrowKeyTime = 0;
      let arrowKeyDelay = 80; // ms, lower = more responsive

      document.addEventListener('keydown', function(e) {
        if (pngFiles.length === 0) return;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          stopPngLoop();
          const now = Date.now();
          if (now - lastArrowKeyTime < arrowKeyDelay) {
            e.preventDefault();
            return;
          }
          lastArrowKeyTime = now;
          if (e.key === 'ArrowLeft') {
            if (currentPngIdx < pngFiles.length - 1) {
              currentPngIdx++;
              setPngOverlayByIndex(currentPngIdx);
            }
          } else if (e.key === 'ArrowRight') {
            if (currentPngIdx > 0) {
              currentPngIdx--;
              setPngOverlayByIndex(currentPngIdx);
            }
          }
          e.preventDefault();
        }
      });

      // Initial load
      loadPngListAndInit();
    </script>
  </div>
</body>
</html>
