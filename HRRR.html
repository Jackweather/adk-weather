<!DOCTYPE html>
<html>
<head>
  <title>USA Reflectivity Overlay</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    /* Top navigation bar */
    #top-navbar {
      width: 100vw;
      background: #263159;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 32px;
      height: 54px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
    }
    #top-navbar .nav-item {
      margin-right: 32px;
      font-size: 1.1em;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
      color: #fff; /* Ensure white text for all nav items */
      text-decoration: none; /* Remove underline for links */
    }
    #top-navbar .nav-item:hover {
      color: #ffb400;
    }
    /* Model selector placement (copied from NBM.html) */
    #model-selector-container {
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0 0 0;
      z-index: 10;
      margin-bottom: 6px;
    }
    #model-selector {
      position: relative;
      margin: 0 auto;
      z-index: 20;
    }
    #model-selector-btn {
      background: #263159;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 28px 9px 16px;
      font-size: 1.13em;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #model-selector-btn:hover {
      background: #ffb400;
      color: #fff;
    }
    #model-selector-list {
      display: none;
      position: absolute;
      top: 110%;
      left: 0;
      min-width: 180px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.13);
      z-index: 3000;
      padding: 6px 0;
      font-size: 1.05em;
    }
    #model-selector.open #model-selector-list {
      display: block;
    }
    #model-selector-list a {
      display: block;
      color: #263159;
      text-decoration: none;
      padding: 8px 18px;
      transition: background 0.13s, color 0.13s;
      border-radius: 4px;
    }
    #model-selector-list a:hover {
      background: #f3f4fa;
      color: #ffb400;
    }
    /* Center map and right panel */
    #main-content {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      width: 100vw;
      min-height: calc(100vh - 54px);
      margin-top: 54px;
      box-sizing: border-box;
      gap: 32px;
      padding: 32px 0 0 0;
    }
    /* Left panel for UTC/time and slider - cleaner look */
    #left-panel {
      width: 220px;
      min-width: 120px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(60,72,88,0.10);
      padding: 24px 18px 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      z-index: 1200;
      height: fit-content;
      border: 1px solid #e6e8ef;
      transition: box-shadow 0.2s;
      gap: 18px;
    }
    #left-panel .utc-box {
      background: #f8fafc;
      border-radius: 10px;
      box-shadow: none;
      border: none;
      padding: 16px 10px 12px 10px;
      font-family: monospace;
      font-size: 1.08em;
      color: #263159;
      text-align: center;
      margin-bottom: 0;
      pointer-events: none;
      user-select: none;
      letter-spacing: 0.01em;
      border: 1px solid #e6e8ef;
    }
    #left-panel .slider-box {
      background: #f8fafc;
      border-radius: 10px;
      box-shadow: none;
      border: none;
      padding: 16px 10px 12px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #e6e8ef;
      gap: 8px;
    }
    #left-panel #hour-slider {
      width: 120px;
      accent-color: #263159;
      margin-bottom: 6px;
      height: 2px;
      border-radius: 2px;
      background: #e0e3ef;
      outline: none;
    }
    #left-panel #hour-label {
      font-family: monospace;
      font-size: 1.08em;
      color: #263159;
      margin-bottom: 2px;
      letter-spacing: 0.01em;
    }
    #left-panel #forecast-time-est {
      margin-top: 2px;
      font-family: monospace;
      color: #444;
      font-size: 0.98em;
      background: none;
      border: none;
      padding: 0;
    }
    #slider-play-btn {
      margin: 10px auto 0 auto;
      display: block;
      padding: 7px 22px;
      font-size: 1.08em;
      border-radius: 8px;
      border: none;
      background: #263159;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }
    #slider-play-btn:hover {
      background: #ffb400;
      color: #fff;
    }
    /* Center map and right panel */
    #map-container {
      flex: 1 1 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
      min-height: 0;
      height: 100%;
    }
    #map {
      height: 78vh;
      width: 64vw;
      min-width: 340px;
      min-height: 340px;
      max-width: 1100px;
      max-height: 800px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      margin: 0 auto;
      border: 1px solid #e6e8ef;
    }
    /* Right panel */
    #right-panel {
      width: 270px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(60,72,88,0.10);
      padding: 22px 0 22px 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 320px;
      z-index: 1200;
      border: 1px solid #e6e8ef;
      gap: 12px;
    }
    /* Dropdown style */
    .dropdown {
      margin: 0 18px 10px 18px;
      border-radius: 10px;
      background: #f5f7fa;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }
    .dropdown-header {
      padding: 10px 16px;
      font-size: 1.08em;
      font-weight: bold;
      color: #263159;
      background: #e8eaf6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      border-bottom: 1px solid #e0e0e0;
    }
    .dropdown-header.severe {
      color: #b71c1c;
      background: #ffebee;
    }
    /* Add green style for Other dropdown */
    .dropdown-header.other {
      color: #1b5e20;
      background: #e8f5e9;
    }
    .dropdown-content {
      display: none;
      padding: 0 16px 10px 16px;
      animation: fadeIn 0.2s;
    }
    .dropdown.open .dropdown-content {
      display: block;
    }
    .dropdown-content label {
      display: block;
      margin: 8px 0 0 0;
      font-size: 1em;
      color: #333;
      cursor: pointer;
    }
    /* Opacity slider containers for HRRR overlays */
    [id^="opacity-"] {
      width: 100px;
      accent-color: #263159;
      vertical-align: middle;
      display: none;
    }
    /* Bottom colorbar bar (copied from NBM.html) */
    #bottom-colorbar-bar {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      background: rgba(255,255,255,0.98);
      box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
      border-top: 1px solid #e6e8ef;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 0;
      min-height: 60px;
      height: 80px;
      transition: height 0.15s;
      box-sizing: border-box;
    }
    #colorbar-resize-handle {
      width: 100px;
      height: 8px;
      cursor: ns-resize;
      background: #e0e3ef;
      border-radius: 4px;
      margin: 6px auto 0 auto;
      position: relative;
      top: 4px;
      transition: background 0.2s;
      z-index: 1;
    }
    #colorbar-resize-handle:hover {
      background: #bfc6e0;
    }
    #colorbar-size-slider-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 0 2px 0;
      padding: 0;
      font-size: 1em;
      color: #444;
      user-select: none;
      gap: 10px;
    }
    #colorbar-size-slider {
      width: 180px;
      accent-color: #263159;
      margin: 0 8px;
    }
    #colorbars-container {
      display: flex;
      flex-direction: row;
      gap: 32px;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      margin: 0;
      padding: 0;
      background: none;
      box-shadow: none;
      padding-bottom: 8px;
    }
    #colorbars-container img {
      max-width: 260px;
      width: 100%;
      height: auto;
      background: none;
      border-radius: 8px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.04);
      transition: max-width 0.15s;
    }
    /* Remove Leaflet attribution */
    .leaflet-control-attribution {
      display: none !important;
    }
    /* Spinner CSS */
    .lds-ring {
      display: inline-block;
      position: relative;
      width: 64px;
      height: 64px;
    }
    .lds-ring div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 48px;
      height: 48px;
      margin: 8px;
      border: 6px solid #1e90ff;
      border-radius: 50%;
      animation: lds-ring 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: #1e90ff transparent transparent transparent;
    }
    .lds-ring div:nth-child(1) {
      animation-delay: -0.3s;
    }
    .lds-ring div:nth-child(2) {
      animation-delay: -0.2s;
    }
    .lds-ring div:nth-child(3) {
      animation-delay: -0.1s;
    }
    @keyframes lds-ring {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* --- Responsive styles for mobile (iPhone/Safari) --- */
    @media (max-width: 900px) {
      #main-content {
        flex-direction: column;
        align-items: stretch;
        margin-top: 54px;
        height: auto;
        min-height: 100vh;
      }
      #left-panel {
        width: 100vw;
        min-width: 0;
        margin: 16px 0 0 0;
        border-radius: 0;
        box-shadow: none;
        border: none;
        flex-direction: row;
        justify-content: flex-start;
        align-items: flex-start;
        padding: 12px 0 12px 0;
        height: auto;
      }
      #left-panel .utc-box,
      #left-panel .slider-box {
        min-width: 0;
        width: 100%;
        margin-bottom: 0;
        margin-right: 0;
        padding: 10px 8px 8px 8px;
        font-size: 1em;
      }
      #left-panel > div {
        margin: 0 8px 0 8px;
      }
      #map-container {
        width: 100vw;
        min-width: 0;
        margin: 0;
        padding: 0;
        height: 60vw;
        min-height: 320px;
        max-height: 60vh;
      }
      #map {
        width: 98vw;
        min-width: 0;
        max-width: 100vw;
        height: 60vw;
        min-height: 320px;
        max-height: 60vh;
        margin: 0 auto;
        border-radius: 0;
      }
      #right-panel {
        width: 100vw;
        min-width: 0;
        margin: 0;
        margin-top: 8px;
        border-radius: 0;
        box-shadow: none;
        border: none;
        padding: 8px 0 8px 0;
        min-height: 0;
      }
      .dropdown {
        margin: 0 8px 6px 8px; /* reduce bottom margin for mobile */
      }
      .dropdown-header {
        padding: 7px 8px; /* reduce padding for mobile */
        font-size: 0.98em;
      }
      .dropdown-content {
        padding: 0 8px 4px 8px; /* reduce padding for mobile */
      }
      #bottom-colorbar-bar {
        min-height: 48px;
        height: 60px;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      #colorbars-container img {
        max-width: 120px !important;
      }
      #colorbar-size-slider-container {
        font-size: 0.95em;
      }
      #colorbar-size-slider {
        width: 100px;
      }
    }
    @media (max-width: 600px) {
      #main-content {
        margin-top: 54px;
      }
      #left-panel {
        flex-direction: column;
        align-items: stretch;
        padding: 6px 0 6px 0;
      }
      #map-container, #map {
        height: 50vw;
        min-height: 200px;
        max-height: 50vh;
      }
      #right-panel {
        padding: 4px 0 4px 0;
      }
      #colorbars-container img {
        max-width: 80px !important;
      }
    }
    /* Make modal fit on mobile */
    #skewt-modal > div {
      max-width: 98vw !important;
      max-height: 98vh !important;
      padding: 6vw 2vw 6vw 2vw !important;
    }
    #skewt-img {
      max-width: 96vw !important;
      max-height: 70vh !important;
    }
    /* Prevent nav bar from overlapping content */
    body {
      padding-top: 54px;
      box-sizing: border-box;
    }

    /* --- Extra mobile/iPhone Safari friendliness --- */
    html, body {
      /* Prevent horizontal scroll on mobile */
      max-width: 100vw;
      overflow-x: hidden;
      /* Smooth scrolling for iOS */
      -webkit-overflow-scrolling: touch;
      /* Prevent zoom on double-tap for buttons/inputs */
      touch-action: manipulation;
    }

    #main-content {
      /* Allow vertical scroll if content overflows on mobile */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #map-container, #map {
      /* Allow map to scroll horizontally if needed */
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #left-panel, #right-panel {
      /* Allow panels to scroll if content overflows */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-height: 80vh;
    }

    /* Ensure navbar is always on top and not overlapped */
    #top-navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3000;
    }

    /* Improve tap targets for checkboxes and buttons */
    input[type="checkbox"], button, label {
      touch-action: manipulation;
    }

    /* Responsive main content order for mobile: left, map, right */
    @media (max-width: 600px) {
      #main-content {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 0 !important;
        padding: 0 !important;
        margin-top: 54px !important;
        min-height: 0 !important;
      }
      #left-panel {
        order: 1 !important;
      }
      #map-container {
        order: 2 !important;
      }
      #right-panel {
        order: 3 !important;
      }
      #model-selector-container {
        order: 0 !important;
        padding-bottom: 0 !important;
      }
    }
    @media (min-width: 601px) {
      #model-selector-container {
        order: 0;
      }
      #left-panel {
        order: 1;
      }
      #map-container {
        order: 2;
      }
      #right-panel {
        order: 3;
      }
    }
  </style>
</head>
<body>
  <!-- Top navigation bar -->
  <div id="top-navbar">
    <a class="nav-item" href="/home.html">Home</a>
    <a class="nav-item" href="/more.html">More</a>
    <a class="nav-item" href="/settings.html">Settings</a>
    <a class="nav-item" href="/usa_leaflet.html">Weather Model Page</a>
    <!-- Remove the old center dropdown from navbar -->
  </div>
  <!-- Model selector moved here (copied from NBM.html) -->
  <div id="model-selector-container">
    <div id="model-selector">
      <button id="model-selector-btn" aria-haspopup="true" aria-expanded="false">
        Select Model
        <span style="margin-left:6px;">&#9662;</span>
      </button>
      <div id="model-selector-list" role="menu">
        <a href="HRRR.html" role="menuitem">HRRR</a>
        <a href="NBM.html" role="menuitem">NBM</a>
      </div>
    </div>
  </div>
  <div id="main-content">
    <!-- Left panel (slider/current time) first -->
    <div id="left-panel">
      <div class="utc-box" id="left-current-time-box"></div>
      <!-- Archive dropdown -->
      <div style="padding: 0 18px 10px 18px;">
        <label for="archive-run-select" style="font-size:1.08em;">Archived HRRR Run:</label>
        <select id="archive-run-select" style="width:100%;margin-top:4px;">
          <option value="current">Current Run</option>
        </select>
      </div>
      <div style="padding: 0 18px 10px 18px;">
        <label style="font-size:1.08em;">
          <input type="checkbox" id="toggle-soundings" style="vertical-align:middle;margin-right:6px;">
          Show Sounding Stations
        </label>
        <span id="soundings-wait-note" style="display:block;font-size:0.97em;color:#b36b00;margin-top:4px;">
          <b>Note:</b> It takes about 45 Seconds to load soundings after turning on.
        </span>
      </div>
      <div class="slider-box" id="left-slider-box" style="display:none;">
        <input type="range" id="hour-slider" min="0" max="0" value="0" step="1">
        <span id="hour-label"></span>
        <div id="forecast-time-est"></div>
        <div style="font-size:0.97em;color:#888;margin-top:10px;">
          New runs 3:50am, 9:50am, 3:50pm, 9:50pm EST
        </div>
        <!-- Play button below the new runs info -->
        <button id="slider-play-btn" style="margin:10px auto 0 auto;display:block;padding:6px 18px;font-size:1.05em;border-radius:6px;border:none;background:#263159;color:#fff;cursor:pointer;">
          ▶ Play
        </button>
      </div>
    </div>
    <!-- Map card -->
    <div id="map-container">
      <div id="map"></div>
      <!-- Modal for Skew-T (if needed, keep as before) -->
      <div id="skewt-modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.5);z-index:5000;align-items:center;justify-content:center;">
        <div style="background:#fff;padding:16px;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,0.18);max-width:95vw;max-height:95vh;overflow:auto;position:relative;">
          <span id="skewt-close" style="position:absolute;top:8px;right:16px;font-size:2em;cursor:pointer;">&times;</span>
          <!-- Spinner overlay -->
          <div id="skewt-spinner" style="display:none;position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(255,255,255,0.7);z-index:10;align-items:center;justify-content:center;">
            <div style="display:flex;align-items:center;justify-content:center;height:100%;">
              <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
            </div>
          </div>
          <img id="skewt-img" src="" alt="Skew-T" style="max-width:90vw;max-height:80vh;display:block;margin:auto;">
        </div>
      </div>
    </div>
    <!-- Right panel (Surface/Severe/Other) last -->
    <div id="right-panel">
      <div class="dropdown" id="dropdown-surface">
        <div class="dropdown-header">
          Surface DATA
          <span class="dropdown-arrow">&#9654;</span>
        </div>
        <div class="dropdown-content">
          <label>
            <input type="checkbox" id="toggle-refc"> Composite Reflectivity
            <input type="range" id="opacity-refc" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
          <label>
            <input type="checkbox" id="toggle-mslp"> Mean Sea Level Pressure
            <input type="range" id="opacity-mslp" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
          <label>
            <input type="checkbox" id="toggle-temp2m"> 2m Temperature
            <input type="range" id="opacity-temp2m" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
          <label>
            <input type="checkbox" id="toggle-rh"> 2m Relative Humidity
            <input type="range" id="opacity-rh" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
          <label>
            <input type="checkbox" id="toggle-precip"> Total Precipitation
            <input type="range" id="opacity-precip" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
          <label>
            <input type="checkbox" id="toggle-wind10m"> 10m Wind
            <input type="range" id="opacity-wind10m" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
          <label>
            <input type="checkbox" id="toggle-wind10m-station"> 10m Wind Bars
            <input type="range" id="opacity-wind10m-station" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
          <label>
            <input type="checkbox" id="toggle-gust"> Wind Gust (mph)
            <input type="range" id="opacity-gust" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
        </div>
      </div>
      <div class="dropdown" id="dropdown-severe">
        <div class="dropdown-header severe">
          Severe Weather
          <span class="dropdown-arrow">&#9654;</span>
        </div>
        <div class="dropdown-content">
          <label>
            <input type="checkbox" id="toggle-lightning"> Lightning
            <input type="range" id="opacity-lightning" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
          <label>
            <input type="checkbox" id="toggle-hail"> Hail Threat Scale
            <input type="range" id="opacity-hail" min="0" max="1" step="0.01" value="0.7" style="width:80px;display:none;vertical-align:middle;">
          </label>
          <label>
            <input type="checkbox" id="toggle-cape"> CAPE

    // Set all checkboxes to unchecked and variables to false on load
    document.getElementById('toggle-refc').checked = false;

    document.getElementById('toggle-hail').checked = false;
    document.getElementById('toggle-cape').checked = false;
    document.getElementById('toggle-cin').checked = false; // CIN
    document.getElementById('toggle-lcdc').checked = false;
    document.getElementById('toggle-mcdc').checked = false;
    document.getElementById('toggle-hcdc').checked = false;
    document.getElementById('toggle-precip').checked = false;
    document.getElementById('toggle-wind10m').checked = false; // WIND10M
    document.getElementById('toggle-wind10m-station').checked = false; // WIND10M at stations
    document.getElementById('toggle-srh').checked = false;
    document.getElementById('toggle-pwat').checked = false;

    // --- Model selector dropdown logic (copied from NBM.html) ---
    (function() {
      var dropdown = document.getElementById('model-selector');
      var btn = document.getElementById('model-selector-btn');
      var list = document.getElementById('model-selector-list');
      // Set initial button text to current model
      function setModelBtnText(model) {
        btn.childNodes[0].nodeValue = model + " ";
      }
      // Detect current model from URL or file
      var currentModel = "HRRR";
      if (window.location.href.match(/NBM\.html/i)) currentModel = "NBM";
      setModelBtnText(currentModel);

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var open = dropdown.classList.contains('open');
        document.querySelectorAll('#model-selector.open').forEach(function(d) {
          d.classList.remove('open');
        });
        if (!open) dropdown.classList.add('open');
      });
      document.addEventListener('click', function(e) {
        if (!dropdown.contains(e.target)) dropdown.classList.remove('open');
      });

      // Update button text on menu item click
      list.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function(e) {
          var model = this.textContent.trim();
          setModelBtnText(model);
          // Let the navigation proceed
        });
      });
    })();

    // --- Dropdown open/close logic for all dropdowns (copied from NBM.html) ---
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.dropdown').forEach(function(dropdown) {
        var header = dropdown.querySelector('.dropdown-header');
        var content = dropdown.querySelector('.dropdown-content');
        var arrow = header.querySelector('.dropdown-arrow');
        // Start closed
        dropdown.classList.remove('open');
        if (arrow) arrow.innerHTML = "&#9654;";
        if (content) content.style.display = "none";
        header.addEventListener('click', function() {
          var isOpen = dropdown.classList.toggle('open');
          if (content) content.style.display = isOpen ? "block" : "none";
          if (arrow) arrow.innerHTML = isOpen ? "&#9660;" : "&#9654;";
        });
      });
    });

    // --- Slider logic (now in left panel) ---
    fetch('/reflectivity_images')
      .then(response => response.json())
      .then(function(images) {
        pngList = images;
        var slider = document.getElementById('hour-slider');
        var label = document.getElementById('hour-label');
        var forecastTimeBox = document.getElementById('forecast-time-est');
        document.getElementById('left-slider-box').style.display = 'flex';

        // Use backend-provided hours for slider (should be 0-48)
        slider.min = 0;
        slider.max = pngList.length > 0 ? pngList.length - 1 : 0;
        slider.value = 0;
        slider.step = 1;

        function getForecastTimeEST(hourOffset) {
          // Get current UTC time
          const now = new Date();
          let utcYear = now.getUTCFullYear();
          let utcMonth = now.getUTCMonth();
          let utcDay = now.getUTCDate();
          let utcHour = now.getUTCHours();

          // Find most recent HRRR run hour (00, 06, 12, 18) <= current UTC hour
          let runHour = Math.floor(utcHour / 6) * 6;
          if (runHour === 24) runHour = 18;
          let dateForRun = new Date(Date.UTC(utcYear, utcMonth, utcDay, utcHour));
          if (utcHour < runHour) {
            dateForRun.setUTCHours(dateForRun.getUTCHours() - 6);
            runHour = Math.floor(dateForRun.getUTCHours() / 6) * 6;
          }
          let dateStr = dateForRun.getUTCFullYear().toString().padStart(4, '0') +
                        String(dateForRun.getUTCMonth() + 1).padStart(2, '0') +
                        String(dateForRun.getUTCDate()).padStart(2, '0');
          let hourStr = String(runHour).padStart(2, '0');

          // Map runHour to local time (EST/EDT) for display
          // 00z -> 8:00 PM, 06z -> 2:00 AM, 12z -> 8:00 AM, 18z -> 2:00 PM
          let displayHour = 20, displayMinute = 0, ampm = "PM";
          if (runHour === 0) { displayHour = 20; ampm = "PM"; }
          else if (runHour === 6) { displayHour = 2; ampm = "AM"; }
          else if (runHour === 12) { displayHour = 8; ampm = "AM"; }
          else if (runHour === 18) { displayHour = 2; ampm = "PM"; }

          // Add hourOffset to the display time
          let displayDate = new Date(Date.UTC(
            dateForRun.getUTCFullYear(),
            dateForRun.getUTCMonth(),
            dateForRun.getUTCDate(),
            runHour
          ));
          // Add hourOffset in hours
          displayDate.setUTCHours(displayDate.getUTCHours() + hourOffset);

          // Convert to America/New_York time zone for display
          let tzDate = new Date(displayDate.toLocaleString("en-US", {timeZone: "America/New_York"}));
          let yy = String(tzDate.getFullYear()).slice(2);
          let mm = String(tzDate.getMonth() + 1).padStart(2, '0');
          let dd = String(tzDate.getDate()).padStart(2, '0');
          let hour24 = tzDate.getHours();
          let minute = tzDate.getMinutes();
          let ampmDisp = hour24 >= 12 ? 'PM' : 'AM';
          let hour12 = hour24 % 12;
          if (hour12 === 0) hour12 = 12;
          let hh = String(hour12).padStart(2, '0');

          // Get day of week string
          const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
          let dayOfWeek = daysOfWeek[tzDate.getDay()];

          return {
            forecastStr: `Forecast valid (EST): ${yy}${mm}${dd} ${hh}:00 ${ampmDisp}`,
            dayOfWeek: dayOfWeek
          };
        }

      window.updateOverlay = function(idx) {
          // Clamp idx to available range
          idx = Math.max(0, Math.min(idx, pngList.length - 1));

          // Remove all overlays first
          if (overlayRefc) { map.removeLayer(overlayRefc); overlayRefc = null; }
          if (overlayMslp) { map.removeLayer(overlayMslp); overlayMslp = null; }
          if (overlayTemp2m) { map.removeLayer(overlayTemp2m); overlayTemp2m = null; }
          if (overlayLightning) { map.removeLayer(overlayLightning); overlayLightning = null; }
          if (overlayRH) { map.removeLayer(overlayRH); overlayRH = null; }
          if (overlayHail) { map.removeLayer(overlayHail); overlayHail = null; }
          if (overlayCAPE) { map.removeLayer(overlayCAPE); overlayCAPE = null; }
          if (overlayCIN) { map.removeLayer(overlayCIN); overlayCIN = null; } // Remove CIN overlay
          if (overlayLCDC) { map.removeLayer(overlayLCDC); overlayLCDC = null; } // Remove LCDC overlay
          if (overlayMCDC) { map.removeLayer(overlayMCDC); overlayMCDC = null; } // Remove MCDC overlay
          if (overlayHCDC) { map.removeLayer(overlayHCDC); overlayHCDC = null; } // Remove HCDC overlay
          if (overlayPrecip) { map.removeLayer(overlayPrecip); overlayPrecip = null; } // Remove Precip overlay
          if (overlayWind10m) { map.removeLayer(overlayWind10m); overlayWind10m = null; } // Remove WIND10M overlay
          if (overlayWind10mStation) { map.removeLayer(overlayWind10mStation); overlayWind10mStation = null; } // Remove WIND10M at stations overlay
          if (overlaySRH) { map.removeLayer(overlaySRH); overlaySRH = null; }
          if (overlayPWAT) { map.removeLayer(overlayPWAT); overlayPWAT = null; }
          if (overlayGust) { map.removeLayer(overlayGust); overlayGust = null; }
          if (overlayShearVector) { map.removeLayer(overlayShearVector); overlayShearVector = null; }

          // Defensive: If idx is out of bounds, do nothing
          if (!pngList || idx < 0 || idx >= pngList.length) return;

          var entry = pngList[idx] || {};
          var cacheBuster = "?t=" + Date.now();

          // Each overlay is toggled independently by its checkbox, use opacity from overlayOpacity
          if (showRefc && entry.refc) overlayRefc = L.imageOverlay(entry.refc + cacheBuster, imageBounds, {opacity: overlayOpacity.refc}).addTo(map);
          if (showMslp && entry.mslp) overlayMslp = L.imageOverlay(entry.mslp + cacheBuster, imageBounds, {opacity: overlayOpacity.mslp}).addTo(map);
          if (showTemp2m && entry.temp2m) overlayTemp2m = L.imageOverlay(entry.temp2m + cacheBuster, imageBounds, {opacity: overlayOpacity.temp2m}).addTo(map);
          if (showLightning && entry.lightning) overlayLightning = L.imageOverlay(entry.lightning + cacheBuster, imageBounds, {opacity: overlayOpacity.lightning}).addTo(map);
          if (showRH && entry.rh) overlayRH = L.imageOverlay(entry.rh + cacheBuster, imageBounds, {opacity: overlayOpacity.rh}).addTo(map);
          if (showHail && entry.hail) overlayHail = L.imageOverlay(entry.hail + cacheBuster, imageBounds, {opacity: overlayOpacity.hail}).addTo(map);
          if (showCAPE && entry.cape) overlayCAPE = L.imageOverlay(entry.cape + cacheBuster, imageBounds, {opacity: overlayOpacity.cape}).addTo(map);
          if (showCIN && entry.cin) overlayCIN = L.imageOverlay(entry.cin + cacheBuster, imageBounds, {opacity: overlayOpacity.cin}).addTo(map); // Add CIN overlay
          if (showLCDC && entry.lcdc) overlayLCDC = L.imageOverlay(entry.lcdc + cacheBuster, imageBounds, {opacity: overlayOpacity.lcdc}).addTo(map); // Add LCDC overlay
          if (showMCDC && entry.mcdc) overlayMCDC = L.imageOverlay(entry.mcdc + cacheBuster, imageBounds, {opacity: overlayOpacity.mcdc}).addTo(map); // Add MCDC overlay
          if (showHCDC && entry.hcdc) overlayHCDC = L.imageOverlay(entry.hcdc + cacheBuster, imageBounds, {opacity: overlayOpacity.hcdc}).addTo(map); // Add HCDC overlay
          if (showPrecip && entry.precip) overlayPrecip = L.imageOverlay(entry.precip + cacheBuster, imageBounds, {opacity: overlayOpacity.precip}).addTo(map); // Add Precip overlay
          if (showWind10m && entry.wind10m) overlayWind10m = L.imageOverlay(entry.wind10m + cacheBuster, imageBounds, {opacity: overlayOpacity.wind10m}).addTo(map); // Add WIND10M overlay
          if (showWind10mStation && entry.wind10m_station) overlayWind10mStation = L.imageOverlay(entry.wind10m_station + cacheBuster, imageBounds, {opacity: overlayOpacity.wind10mStation}).addTo(map); // Add WIND10M at stations overlay
          if (showSRH && entry.srh) overlaySRH = L.imageOverlay(entry.srh + cacheBuster, imageBounds, {opacity: overlayOpacity.srh}).addTo(map);
          if (showPWAT && entry.pwat) overlayPWAT = L.imageOverlay(entry.pwat + cacheBuster, imageBounds, {opacity: overlayOpacity.pwat}).addTo(map); // Add PWAT overlay
          if (showGust && entry.gust) overlayGust = L.imageOverlay(entry.gust + cacheBuster, imageBounds, {opacity: overlayOpacity.gust}).addTo(map); // Add GUST overlay
          if (showShearVector && entry.shear_vector) overlayShearVector = L.imageOverlay(entry.shear_vector + cacheBuster, imageBounds, {opacity: overlayOpacity.shearVector}).addTo(map); // Add Shear Vector overlay

          // Always show hour label and forecast time if entry exists
          if (entry && typeof entry.hour !== "undefined") {
            label.textContent = `Hour: ${entry.hour}`;
            // Get forecast string and day of week
            var forecastInfo = getForecastTimeEST(entry.hour);
            forecastTimeBox.innerHTML = forecastInfo.forecastStr + "<br><span style='color:#263159;font-size:1.01em;'>" + forecastInfo.dayOfWeek + "</span>";
          } else {
            label.textContent = "No data";
            forecastTimeBox.textContent = "";
          }
          updateColorbars(getVisibleLayers());
        };

        slider.oninput = function() {
          updateOverlay(parseInt(slider.value));
        };

        // Add arrow key support
        document.addEventListener('keydown', function(e) {
          if (['ArrowRight', 'ArrowLeft'].includes(e.key)) {
            e.preventDefault();
            var idx = parseInt(slider.value);
            if (e.key === 'ArrowRight' && idx < pngList.length - 1) {
              slider.value = idx + 1;
              slider.dispatchEvent(new Event('input'));
            } else if (e.key === 'ArrowLeft' && idx > 0) {
              slider.value = idx - 1;
              slider.dispatchEvent(new Event('input'));
            }
          }
        });

        // Always show slider for 0–48
        updateOverlay(0);

    // --- Current UTC time and HRRR run display (now in left panel) ---
    function updateCurrentTimeBox() {
      const box = document.getElementById('left-current-time-box');
      const now = new Date();
      // UTC time
      const utcYear = now.getUTCFullYear();
      const utcMonth = String(now.getUTCMonth() + 1).padStart(2, '0');
      const utcDay = String(now.getUTCDate()).padStart(2, '0');
      const utcHour = now.getUTCHours();
      const utcMin = String(now.getUTCMinutes()).padStart(2, '0');
      const utcSec = String(now.getUTCSeconds()).padStart(2, '0');
      // HRRR run logic
      let runHour = Math.floor(utcHour / 6) * 6;
      if (runHour === 24) runHour = 18;
      let dateForRun = new Date(Date.UTC(utcYear, now.getUTCMonth(), utcDay, utcHour));
      if (utcHour < runHour) {
        dateForRun.setUTCHours(dateForRun.getUTCHours() - 6);
        runHour = Math.floor(dateForRun.getUTCHours() / 6) * 6;
      }
      const dateStr = dateForRun.getUTCFullYear().toString() +
        String(dateForRun.getUTCMonth() + 1).padStart(2, '0') +
        String(dateForRun.getUTCDate()).padStart(2, '0');
      const hourStr = String(runHour).padStart(2, '0');
      // Display
      box.innerHTML =
        `<b>Current UTC:</b> ${utcYear}-${utcMonth}-${utcDay} ${String(utcHour).padStart(2, '0')}:${utcMin}:${utcSec}<br>` +
        `<b>Most Recent HRRR Run:</b> ${dateStr} ${hourStr}z`;
    }

    setInterval(updateCurrentTimeBox, 10000);

    function getSpcCatColor(cat) {
      cat = (cat || "").toLowerCase();
      if (cat.includes("tstm")) return "#55BB55";
      if (cat.includes("mrgl")) return "#005500";
      if (cat.includes("slgt")) return "#DDAA00";
      if (cat.includes("enh"))  return "#FF6600";
      if (cat.includes("mdt"))  return "#CC0000";
      if (cat.includes("high")) return "#CC00CC";
      return "#888";
    }
    function getSpcCatFill(cat) {
      cat = (cat || "").toLowerCase();
      if (cat.includes("tstm")) return "#C1E9C1";
      if (cat.includes("mrgl")) return "#66A366";
      if (cat.includes("slgt")) return "#FFE066";
      if (cat.includes("enh"))  return "#FFA366";
      if (cat.includes("mdt"))  return "#E06666";
      if (cat.includes("high")) return "#EE99EE";
      return "#ccc";
    }
    function styleSpcCatFeature(feature) {
      var cat = feature && feature.properties && feature.properties.label ? feature.properties.label : "";
      var color = feature && feature.properties && feature.properties.color ? feature.properties.color : getSpcCatColor(cat);
      var fillColor = feature && feature.properties && feature.properties.fill ? feature.properties.fill : getSpcCatFill(cat);
      return {
        color: color,
        weight: 2,
        fillColor: fillColor,
        fillOpacity: 0.32,
        opacity: 1
      };
    }
    function addSpcCatLayer(day) {
      var url;
      if (day === 'day1') {
        if (spcDay1CatLayer) {
          map.addLayer(spcDay1CatLayer);
          return;
        }
        url = 'https://www.spc.noaa.gov/products/outlook/day1otlk_cat.nolyr.geojson';
      } else if (day === 'day2') {
        if (spcDay2CatLayer) {
          map.addLayer(spcDay2CatLayer);
          return;
        }
        url = 'https://www.spc.noaa.gov/products/outlook/day2otlk_cat.nolyr.geojson';
      } else if (day === 'day3') {
        if (spcDay3CatLayer) {
          map.addLayer(spcDay3CatLayer);
          return;
        }
        url = 'https://www.spc.noaa.gov/products/outlook/day3otlk_cat.nolyr.geojson';
      } else {
        return;
      }
      fetch(url)
        .then(r => r.json())
        .then(function(geojson) {
          var deltaLat = 0.85;
          function shiftCoords(coords) {
            if (typeof coords[0] === "number") {
              return [coords[0], coords[1] + deltaLat];
            }
            return coords.map(shiftCoords);
          }
          geojson.features.forEach(function(feature) {
            if (feature.geometry && feature.geometry.coordinates) {
              feature.geometry.coordinates = shiftCoords(feature.geometry.coordinates);
            }
          });
          var layer = L.geoJSON(geojson, {
            style: styleSpcCatFeature
          });
          layer.addTo(map);
          if (day === 'day1') spcDay1CatLayer = layer;
          if (day === 'day2') spcDay2CatLayer = layer;
          if (day === 'day3') spcDay3CatLayer = layer;
        });
    }
    function removeSpcCatLayer(day) {
      if (day === 'day1' && spcDay1CatLayer) {
        map.removeLayer(spcDay1CatLayer);
      }
      if (day === 'day2' && spcDay2CatLayer) {
        map.removeLayer(spcDay2CatLayer);
      }
      if (day === 'day3' && spcDay3CatLayer) {
        map.removeLayer(spcDay3CatLayer);
      }
    }

    // --- Soundings overlay logic ---
    var soundingMarkers = [];
    var soundingsDelayTimer = null;
    var soundingsDelayActive = false;
    var soundingAutoOffTimer = null;

    function addSoundingMarkers(stations) {
      removeSoundingMarkers(); // Always clear before adding
      // Only plot stations within [-126, -69] longitude and [24, 50] latitude
      const minLon = -126, maxLon = -69, minLat = 24, maxLat = 50;
      if (stations && stations.length > 0 && document.getElementById("toggle-soundings").checked) {
        stations
          .filter(stn =>
            stn.lon >= minLon && stn.lon <= maxLon &&
            stn.lat >= minLat && stn.lat <= maxLat
          )
          .forEach(function(stn) {
            var marker = L.circleMarker([stn.lat + 0.9, stn.lon], { // <-- Shift north by 2 degrees
              radius: 7,
              color: "#1e90ff",
              fillColor: "#1e90ff",
              fillOpacity: 0.85,
              weight: 1,
              pane: "markerPane"
            }).addTo(map);
            marker.bindTooltip(stn.name, {permanent: false, direction: "top"});
            marker.on('click', function() {
              showSkewtModal(stn.name);
            });
            soundingMarkers.push(marker);
          });
      }
      map.invalidateSize();
    }
    function removeSoundingMarkers() {
      soundingMarkers.forEach(function(m) { map.removeLayer(m); });
      soundingMarkers = [];
      document.getElementById("skewt-modal").style.display = "none";
      document.getElementById("skewt-img").src = "";
      map.invalidateSize();
    }
    // Remove any dots on initial page load
    removeSoundingMarkers();

    function startSoundingsDelay(callback) {
      soundingsDelayActive = true;
      removeSoundingMarkers();
      if (soundingsDelayTimer) clearTimeout(soundingsDelayTimer);
      soundingsDelayTimer = setTimeout(function() {
        soundingsDelayActive = false;
        if (typeof callback === "function") callback();
      }, 5000);
    }

    document.getElementById("toggle-soundings").addEventListener("change", function() {
      document.getElementById("toggle-soundings").disabled = true;
      // Clear any previous auto-off timer
      if (soundingAutoOffTimer) {
        clearTimeout(soundingAutoOffTimer);
        soundingAutoOffTimer = null;
      }
      // Set a new 5-minute auto-off timer
      if (this.checked) {
        soundingAutoOffTimer = setTimeout(function() {
          document.getElementById("toggle-soundings").checked = false;
          removeSoundingMarkers();
          document.getElementById("toggle-soundings").disabled = false;
        }, 5 * 60 * 1000); // 5 minutes
      }
      startSoundingsDelay(() => {
        if (document.getElementById("toggle-soundings").checked) {
          fetch("/run_mainsounding", {method: "POST"})
            .then(() => {
              setTimeout(function() {
                function pollReady(attempts) {
                  fetch("/soundings_ready")
                    .then(r => r.json())
                    .then(function(resp) {
                      if (resp && resp.ready) {
                        fetch("/soundings_stations")
                          .then(r => r.json())
                          .then(addSoundingMarkers)
                          .finally(() => { document.getElementById("toggle-soundings").disabled = false; });
                      } else if (attempts < 60) {
                        setTimeout(function() { pollReady(attempts + 1); }, 1000);
                      } else {
                        document.getElementById("toggle-soundings").disabled = false;
                      }
                    })
                    .catch(function() {
                      if (attempts < 60) setTimeout(function() { pollReady(attempts + 1); }, 1000);
                      else document.getElementById("toggle-soundings").disabled = false;
                    });
                }
                pollReady(0);
              }, 45000); // 45 seconds delay
            });
        } else {
          removeSoundingMarkers();
          document.getElementById("toggle-soundings").disabled = false;
        }
      });
    });

    function showSkewtModal(station) {

      document.getElementById("skewt-spinner").style.display = "flex";
      fetchSoundingTimes(station, function(times) {
        currentSkewtTimes = times;
        currentSkewtIdx = 0;
        updateSkewtImg();
        document.getElementById("skewt-modal").style.display = "flex";
      });
    }

    function updateSkewtImg() {
      var img = document.getElementById("skewt-img");
      var spinner = document.getElementById("skewt-spinner");
      spinner.style.display = "flex";
      img.style.visibility = "hidden";
      img.onload = function() {
        spinner.style.display = "none";
        img.style.visibility = "visible";
      };
      img.onerror = function() {
        spinner.style.display = "none";
        img.style.visibility = "visible";
      };
      img.src =
        "/skewt_image?station=" + encodeURIComponent(currentSkewtStation) +
        "&time=" + currentSkewtIdx;
    }

    document.addEventListener('keydown', function(e) {
      if (document.getElementById("skewt-modal").style.display === "flex") {
        if (e.key === "ArrowRight" && currentSkewtIdx < currentSkewtTimes.length - 1) {
          currentSkewtIdx++;
          updateSkewtImg();
        } else if (e.key === "ArrowLeft" && currentSkewtIdx > 0) {
          currentSkewtIdx--;
          updateSkewtImg();
        }
      }
    });

    // --- Archive run dropdown logic ---
    // Make archiveRunsList and currentArchiveIdx global
    var archiveRunsList = ["current"];
    var currentArchiveIdx = 0;

    function fetchArchiveRuns() {
      fetch('/hrrr_archives')
        .then(r => r.json())
        .then(function(runs) {
          var select = document.getElementById('archive-run-select');
          // Remove all except "Current Run"
          select.innerHTML = '<option value="current">Current Run</option>';
          archiveRunsList = ["current"].concat(runs);
          runs.forEach(function(run) {
            var opt = document.createElement('option');
            opt.value = run;
            opt.textContent = run;
            select.appendChild(opt);
          });
          // Set currentArchiveIdx to match current selection
          var selected = select.value;
          currentArchiveIdx = archiveRunsList.indexOf(selected);
        });
    }
    fetchArchiveRuns();

    // Helper to fetch images for a given archive run
    function fetchReflectivityImages(archive) {
      if (archive && archive !== 'current') {
        // Use the correct endpoint for archive overlays
        return fetch('/reflectivity_images?archive=' + encodeURIComponent(archive)).then(r => r.json());
      } else {
        // Use the current endpoint for the latest run
        return fetch('/reflectivity_images').then(r => r.json());
      }
    }

    // Listen for archive selection changes
    document.getElementById('archive-run-select').addEventListener('change', function() {
      var archive = this.value;
      currentArchiveIdx = archiveRunsList.indexOf(archive);
      var slider = document.getElementById('hour-slider');
      var hourIdx = parseInt(slider.value) || 0;
      fetchReflectivityImages(archive).then(function(images) {
        pngList = images;
        slider.min = 0;
        slider.max = pngList.length > 0 ? pngList.length - 1 : 0;
        if (hourIdx > slider.max) hourIdx = slider.max;
        slider.value = hourIdx;
        slider.step = 1;
        updateOverlay(hourIdx);
      });
    });

    // --- Add up/down arrow key support for switching runs ---
    document.addEventListener('keydown', function(e) {
      // Only trigger if focus is not on an input/select/textarea
      if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
      var select = document.getElementById('archive-run-select');
      if (!archiveRunsList.length) return;
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        var dir = e.key === "ArrowUp" ? -1 : 1;
        var newIdx = currentArchiveIdx + dir;
        if (newIdx < 0) newIdx = 0;
        if (newIdx >= archiveRunsList.length) newIdx = archiveRunsList.length - 1;
        if (newIdx !== currentArchiveIdx) {
          currentArchiveIdx = newIdx;
          select.value = archiveRunsList[newIdx];
          // Keep current hour index
          var slider = document.getElementById('hour-slider');
          var hourIdx = parseInt(slider.value) || 0;
          // Always fetch the correct images for the selected run
          fetchReflectivityImages(archiveRunsList[newIdx]).then(function(images) {
            pngList = images;
            slider.min = 0;
            slider.max = pngList.length > 0 ? pngList.length - 1 : 0;
            if (hourIdx > slider.max) hourIdx = slider.max;
            slider.value = hourIdx;
            slider.step = 1;
            updateOverlay(hourIdx);
          });
        }
      }
    });
  </script>
</body>
</html>
