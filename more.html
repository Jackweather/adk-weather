<!DOCTYPE html>
<html>
<head>
  <title>More - Weather App</title>
  <meta charset="utf-8" />
  <style>
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: #f7f7f7; 
      margin: 0;
      padding-top: 54px; /* Prevent navbar overlap */
      box-sizing: border-box;
    }
    #top-navbar {
      width: 100vw;
      background: #263159;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 32px;
      height: 54px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
    }
    .nav-item {
      margin-right: 32px;
      font-size: 1.1em;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
      transition: color 0.15s;
      cursor: pointer;
      user-select: none;
    }
    .nav-item:hover { color: #ffb400; }
    .main-content { 
      padding: 40px; 
      max-width: 900px;
      margin: 0 auto;
    }
    @media (max-width: 700px) {
      .main-content {
        padding: 12px 2vw 12px 2vw;
        max-width: 100vw;
      }
    }
    @media (max-width: 480px) {
      .main-content {
        padding: 6px 1vw 6px 1vw;
      }
    }
  </style>
</head>
<body>
  <div id="top-navbar">
    <a class="nav-item" href="/home.html">Home</a>
    <a class="nav-item" href="/more.html">More</a>
    <a class="nav-item" href="/settings.html">Settings</a>
    <a class="nav-item" href="/HRRR.html">Weather Model Page</a>
  </div>
  <div class="main-content">
    <h2>Latest NWS AFD Summary</h2>
    <div style="font-size:0.98em;color:#444;margin-bottom:8px;">
      <b>Note:</b>  Albany, New York area only.
    </div>
    <div id="afd-summary">Loading summary...</div>
    <script>
      // Adjust the filename/site as needed
      fetch('afd_summary_ALY.txt')
        .then(response => response.text())
        .then(text => {
          document.getElementById('afd-summary').textContent = text;
        })
        .catch(err => {
          document.getElementById('afd-summary').textContent = "Failed to load summary.";
        });
    </script>
  </div>
</body>
</html>
